<center>
    <div
        style="background-color: lightblue;
            padding: 20px;
            border: 5px solid blue;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 50px;">
        Rice Middle School - ASL Interpreter
    </div>
    <br />
</center>
<style>
    #myParentDiv {
        border: 2px solid blue;
        padding: 12px;
        min-height: 14px;
        font-family: Arial;
        color: red;
        display: block;
        max-width: 100%;
        width: 100%;
        align-items: center;
        text-align: center;
    }
    #myNewDiv {
        border: 1px solid green;
        padding: 12px;
        font-size: 18px;
        font-family: Arial;
        color: blue;
        display: block;
        margin-top: 5px;
        max-width: 100%;
        width: 100%;
        align-items: center;
        text-align: center;
    }
    /* Big button style for prominent UI controls */
    .big-button {
        font-size: 36px;
        padding: 18px 36px;
        border-radius: 8px;
        min-width: 220px;
        min-height: 64px;
        line-height: 1.1;
        border: 3px solid #444;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }
    /* Make canvas and other elements responsive */
    canvas {
        max-width: 100%;
        height: auto !important;
        display: block;
        margin: 0 auto;
    }
   
    /* Mobile adjustments */
    @media (max-width: 480px) {
        .big-button {
            font-size: 28px;
            padding: 14px 24px;
            min-width: 160px;
            min-height: 56px;
        }
        #myParentDiv, #myNewDiv {
            padding: 12px;
            font-size: 18px;
            width: calc(100% - 24px);
        }
    }

    /* Tablet adjustments */
    @media (min-width: 481px) and (max-width: 768px) {
        .big-button {
            font-size: 32px;
            padding: 16px 28px;
            min-width: 200px;
            min-height: 60px;
        }
        #myParentDiv, #myNewDiv {
            padding: 14px;
            font-size: 19px;
            width: calc(100% - 32px);
        }
    }

    /* Table / column alignment helpers */
    #mainTable td { vertical-align: top; }
    .right-column .content { width:100%; max-width:640px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:12px; }
    .right-column canvas { width:100%; max-width:640px; height:auto; display:block; }
    #label-container { width:100%; max-width:640px; box-sizing:border-box; display:block; text-align:center; }
</style>

<!-- Two-column layout: controls on the left, camera + labels on the right -->
<div style="width:100%; display:flex; justify-content:center;">
    <table id="mainTable" style="border-collapse:collapse; max-width:1000px; width:95%;">
        <tr>
            <td style="vertical-align:top; width:340px; padding:16px;">
                <div style="display:flex; flex-direction:column; gap:16px; align-items:center;">
                    <button id="startBtn" class="big-button" type="button" onclick="init()" style="background-color: lightblue">Start</button>
                    <div style="text-align:center; width:100%;">
                        <!--<label for="cameraSelect" style="font-size:20px; margin-right:8px; display:block; margin-bottom:6px;">Camera:</label> -->
                        <div style="display:flex; justify-content:center; gap:8px; align-items:center;">
                            <!-- <select id="cameraSelect" style="font-size:18px; min-width:180px;"></select> -->
                            <button id="flipBtn" class="big-button" type="button" onclick="flipToNext()" style="background-color: lightcoral;">Flip</button>
                        </div>
                    </div>
                    
                </div>
            </td>
            <td class="right-column" style="vertical-align:top; padding:16px;">
                <div class="content">
                    <canvas id="canvas"></canvas>
                    <div id="label-container"></div>
                </div>
                <div style="display:flex; justify-content:center; margin-top:12px;">
                    <button id="clearBtn" class="big-button" type="button" onclick="clearMessage()" style="background-color: yellowgreen">Clear</button>
                </div>
            </td>
        </tr>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
<script type="text/javascript">
    const accuracyPercent = 92;
    // More API functions here:
    // https://github.com/googlecreativelab/teachablemachine-community/tree/master/libraries/pose

    // the link to your model provided by Teachable Machine export panel
    const URL = "./my_model/";
    let model, webcam, ctx, labelContainer, maxPredictions;
    let availableVideoDevices = [];
    let currentDeviceId = null;
    let actualSizeGlobal = null;
    let flipGlobal = true;
    // For fallback when tmPose.Webcam.setup with deviceId constraints fails
    let manualVideo = null;
    let useManualStream = false;

    async function init() {
        //alert ('init');
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        // load the model and metadata
        // Refer to tmImage.loadFromFiles() in the API to support files from a file picker
        // Note: the pose library adds a tmPose object to your window (window.tmPose)
        //alert ('loading the model');
        model = await tmPose.load(modelURL, metadataURL);
        //alert ('getting max predictions');
        maxPredictions = model.getTotalClasses();
        
        // Convenience function to setup a webcam
        // Choose a display size that fits the viewport but caps at 400px
        function getDisplaySize() {
            const container = document.getElementById("canvas").parentElement;
            const availWidth = container && container.clientWidth ? container.clientWidth : window.innerWidth;
            const availHeight = window.innerHeight;
            // use 95% of the smaller viewport dimension, clamp between 200 and 400
            const calculated = Math.floor(Math.min(availWidth, availHeight) * 0.95);
            return Math.max(200, Math.min(400, calculated));
        }
   
        const displaySize = getDisplaySize();
        const ratio = window.devicePixelRatio || 1;
        const actualSize = displaySize * ratio; // pixel dimensions used by the webcam
        const flip = true; // whether to flip the webcam
        // store globals so switching can re-create the webcam
        actualSizeGlobal = actualSize;
        flipGlobal = flip;
        webcam = new tmPose.Webcam(actualSize, actualSize, flip); // width, height, flip
        try {
            await webcam.setup(); // request access to the webcam (default device)
            await webcam.play();
            window.requestAnimationFrame(loop);
        } catch (e) {
            alert('Unable to access the camera: ' + e.message);
            return;
        }

        // create hidden fallback video element (used for manual getUserMedia fallback)
        manualVideo = document.createElement('video');
        manualVideo.autoplay = true;
        manualVideo.muted = true;
        manualVideo.playsInline = true;
        manualVideo.style.display = 'none';
        document.body.appendChild(manualVideo);

        // populate camera list after permission granted
        await populateCameraList();

        // append/get elements to the DOM
        const canvas = document.getElementById("canvas");
        // set canvas internal (pixel) size to actualSize, but style it to displaySize so it scales responsively
        canvas.width = actualSize;
        canvas.height = actualSize;
        canvas.style.width = displaySize + "px";
        canvas.style.height = displaySize + "px";
        ctx = canvas.getContext("2d");

        // If the user resizes the window, reload after a short debounce so sizes reinitialize.
        // (Safer than trying to recreate the webcam instance dynamically.)
        let _resizeTimer = null;
        window.addEventListener("resize", () => {
            clearTimeout(_resizeTimer);
            _resizeTimer = setTimeout(() => {
                try {
                    // stop webcam to release camera before reload
                    if (webcam && webcam.stop) webcam.stop();
                } catch (e) {}
                location.reload();
            }, 300);
        });
        labelContainer = document.getElementById("label-container");
        const newDiv = document.createElement("div");
        newDiv.id = "myParentDiv";
        labelContainer.appendChild(newDiv);
        const pDiv = document.createElement("div");
        pDiv.id = "myNewDiv";
        labelContainer.appendChild(pDiv);
        //for (let i = 0; i < maxPredictions; i++) { // and class labels
        //    labelContainer.appendChild(document.createElement("div"));
        //}
    }

    // Populate the camera dropdown with available video input devices
    async function populateCameraList() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            availableVideoDevices = devices.filter(d => d.kind === 'videoinput');
            const select = document.getElementById('cameraSelect');
            select.innerHTML = '';
            availableVideoDevices.forEach((device, idx) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                // device.label may be empty until permission is granted; provide fallback
                option.text = device.label || `Camera ${idx + 1}`;
                select.appendChild(option);
            });

            // Set selected to current camera if known
            if (webcam && webcam.webcam && webcam.webcam.srcObject) {
                // try to determine current deviceId
                const tracks = webcam.webcam.srcObject.getVideoTracks();
                if (tracks && tracks[0] && tracks[0].getSettings) {
                    const settings = tracks[0].getSettings();
                    if (settings.deviceId) {
                        currentDeviceId = settings.deviceId;
                        select.value = currentDeviceId;
                    }
                }
            }

            select.onchange = async (e) => {
                const id = e.target.value;
                await switchCamera(id);
            };
        } catch (err) {
            console.warn('Could not list media devices', err);
        }
    }


    async function switchCamera(deviceId) {
        if (!deviceId) return;
        // stop any existing manual stream tracks
        function stopManualStream() {
            try {
                if (manualVideo && manualVideo.srcObject) {
                    const tracks = manualVideo.srcObject.getTracks();
                    tracks.forEach(t => t.stop());
                    manualVideo.srcObject = null;
                }
            } catch (e) {}
        }

        try {
            // stop current tmPose webcam to release device
            if (webcam && webcam.stop) {
                try { webcam.stop(); } catch (e) {}
            }
            stopManualStream();

            // try to setup tmPose.Webcam with an exact deviceId constraint
            webcam = new tmPose.Webcam(actualSizeGlobal, actualSizeGlobal, flipGlobal);
            try {
                await webcam.setup({ video: { deviceId: { exact: deviceId } } });
                await webcam.play();
                useManualStream = false;
                currentDeviceId = deviceId;
                window.requestAnimationFrame(loop);
                return;
            } catch (err) {
                // fallback to native getUserMedia
                console.warn('tmPose.Webcam.setup with deviceId failed, falling back to getUserMedia', err);
            }

            // Fallback: request native media stream and assign to hidden video element
            const constraints = { video: { deviceId: { exact: deviceId } } };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            if (!manualVideo) {
                manualVideo = document.createElement('video');
                manualVideo.autoplay = true;
                manualVideo.muted = true;
                manualVideo.playsInline = true;
                manualVideo.style.display = 'none';
                document.body.appendChild(manualVideo);
            }
            // stop any previous stream then set new
            stopManualStream();
            manualVideo.srcObject = stream;
            try { await manualVideo.play(); } catch (e) {}
            useManualStream = true;
            currentDeviceId = deviceId;
            // continue the loop (loop checks useManualStream)
            window.requestAnimationFrame(loop);
        } catch (e) {
            alert('Could not switch camera: ' + e.message);
            console.error(e);
        }
    }

    // Flip to the next available camera in the list
    async function flipToNext() {
        if (!availableVideoDevices || availableVideoDevices.length === 0) return;
        const select = document.getElementById('cameraSelect');
        const currentIndex = availableVideoDevices.findIndex(d => d.deviceId === (select.value || currentDeviceId));
        const nextIndex = (currentIndex + 1) % availableVideoDevices.length;
        select.selectedIndex = nextIndex;
        await switchCamera(availableVideoDevices[nextIndex].deviceId);
    }

    async function loop(timestamp) {
        if (!useManualStream && webcam && webcam.update) webcam.update(); // update the webcam frame
        await predict();
        window.requestAnimationFrame(loop);
    }
    var lastPrediction = "";
    async function predict() {
        // Prediction #1: run input through posenet
        // estimatePose can take in an image, video or canvas html element
        const inputSource = useManualStream && manualVideo ? manualVideo : webcam.canvas;
        const { pose, posenetOutput } = await model.estimatePose(inputSource);
        // Prediction 2: run input through teachable machine classification model
        const prediction = await model.predict(posenetOutput);
        labelContainer.childNodes[0].innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
            if (prediction[i].probability.toFixed(2) > accuracyPercent / 100) {
                const classPrediction = prediction[i].className + ": " + prediction[i].probability.toFixed(2);
                //labelContainer.childNodes[0].innerHTML = classPrediction;
                labelContainer.childNodes[0].innerHTML = prediction[i].className;

                //Only add to the message text when it is not the same as the last prediction
                if (
                    !(prediction[i].className == lastPrediction) &&
                    !(prediction[i].className.toUpperCase() == "SAY SOMETHING")
                ) {
                    labelContainer.childNodes[1].innerHTML =
                        labelContainer.childNodes[1].innerHTML + " " + prediction[i].className;
                    
                    lastPrediction = prediction[i].className;
                }
            } else {
                //labelContainer.childNodes[0].innerHTML = "Can you please say that again?";
            }

            //show all predictions
            //if (prediction[2].probability.toFixed(2)>0.5)
            //labelContainer.childNodes[1].innerHTML = labelContainer.childNodes[1].innerHTML+ prediction[i].className + ": " + prediction[2].probability.toFixed(2)+", ";
            //const classPrediction =
            //    prediction[i].className + ": " + prediction[i].probability.toFixed(2);
            //labelContainer.childNodes[i].innerHTML = classPrediction;
        }

        // finally draw the poses
        drawPose(pose);
    }
    function clearMessage() {
        labelContainer.childNodes[1].innerHTML = "";
    }
    function drawPose(pose) {
        if (webcam.canvas) {
            // Draw the webcam or manual video output into our (possibly high-DPI) canvas
            const src = useManualStream && manualVideo ? manualVideo : webcam.canvas;
            ctx.drawImage(src, 0, 0, canvas.width, canvas.height);
            // draw the keypoints and skeleton
            if (pose) {
                const minPartConfidence = 0.5;
                tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
            }
        }
    }
</script>
